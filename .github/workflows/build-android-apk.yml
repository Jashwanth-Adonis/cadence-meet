name: Build Cadence Meet Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies and build web bundle
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
          npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Stage APK for web download
        run: |
          mkdir -p public/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk public/downloads/cadence-meet.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: cadence-meet-android-apk
          path: public/downloads/cadence-meet.apk
